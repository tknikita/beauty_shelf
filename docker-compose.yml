services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - db_data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      # Server-local timezone used by /api/expiring. Set TZ to your zone so
      # the web expiry window matches the device's local date.
      - TZ=${TZ:-Europe/Moscow}

  frontend:
    build:
      context: ./beauty_shelf_app
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
