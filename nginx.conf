server {
    listen 80;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;
    
    # CORS headers for Flet web
    add_header Access-Control-Allow-Origin "*";
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
    add_header Access-Control-Allow-Headers "Content-Type, Accept";
    
    # ==============================================
    # MIME type handlers MUST come BEFORE location /
    # ==============================================
    
    # ES Modules - .mjs files (NO caching)
    location ~ \.mjs$ {
        types { }
        default_type "application/javascript";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # WASM modules - .wasm files (NO caching)
    location ~ \.wasm$ {
        types { }
        default_type "application/wasm";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # All JavaScript files (NO caching during dev)
    location ~ \.js$ {
        types { }
        default_type "application/javascript";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # ==============================================
    # Handle OPTIONS preflight
    # ==============================================
    location = /options {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Accept";
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }
    
    # Root - serve index.html
    location = / {
        try_files /index.html =404;
    }
    
    # All other paths - SPA routing
    location / {
        # Handle CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Accept";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
        
        try_files $uri $uri/ /index.html;
    }
    
    # ==============================================
    # Proxy API to backend
    # ==============================================
    location /api/ {
        add_header Access-Control-Allow-Origin "*";
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # ==============================================
    # WebSocket for Flet
    # ==============================================
    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
